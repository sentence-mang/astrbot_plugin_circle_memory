name: astrbot_plugin_shared_context
display_name: 跨平台共享上下文
short_desc: 多平台会话组成共享组，组内跨平台共享同一份对话历史；组 ID 即 conversation_id，其他插件填组 ID 即可读写。
author: sentence-mang
version: "1.1.3"
desc: |
  将多个平台（飞书、微信、QQ、Telegram 等）的多个会话组成「会话组」，组内跨平台共享同一份对话历史——在飞书聊完，微信/QQ 可以无缝接续。

  核心特性：
  - 每个组拥有稳定组 ID（g-xxxx），组共享会话以组 ID 作为 conversation_id 入库，其他插件填组 ID 即可定位共享会话，零适配；
  - 邀请码加入（5 分钟有效、失败 5 次作废，防暴力枚举）；
  - 权限隔离：组 ID 仅组内成员与平台管理员可见；解散仅创建组的会话（组管理员）可操作；
  - 旧版（uuid 共享会话）自动迁移，历史完整保留；迁移幂等可重入；
  - 组管理全部通过 /shared 命令完成。

  命令：/shared create、/shared code、/shared join、/shared leave、/shared dissolve、/shared id、/shared list
repo: https://github.com/sentence-mang/astrbot_plugin_shared_context
astrbot_version: ">=4.0.0"
support_platforms:
  - lark
  - weixin_oc
  - qq_official
  - aiocqhttp
  - telegram
  - all
tags:
  - 上下文
  - 共享
  - 多平台
